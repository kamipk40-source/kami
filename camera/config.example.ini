# Copy this file to config.ini and fill it in. Never share config.ini or put it on GitHub.

[supabase]
url = https://wpadbzbjeqinsxpblnqx.supabase.co
anon_key = sb_publishable_qIYABs0_jJCBTJ-tn294uA_jWy0NJUA
# The camera user: create it in Supabase > Authentication > Users (a different user from the admin).
email = camera@example.com
password = CHANGE-ME

[recognition]
# Face match strictness. Higher = fewer wrong matches, but more people missed.
# 0.45 is a good start. If strangers are matched, raise it to 0.5. If staff are missed, lower it to 0.40.
threshold = 0.45
# The best match must beat the second best person by at least this much.
margin = 0.05
# Smallest face (in pixels wide) that is used. Faces further away are ignored.
min_face = 80
# Look at every Nth picture from the camera (5 is fine for a 25 fps camera).
process_every = 5
# A person must be recognised this many times within 4 seconds before attendance is sent.
confirm = 2

[cameras]
# Name = address. The name is shown in the app. Use 0 for a USB webcam (good for a first test).
# Hikvision:  rtsp://USER:PASSWORD@192.168.1.64:554/Streaming/Channels/101
# Dahua:      rtsp://USER:PASSWORD@192.168.1.64:554/cam/realmonitor?channel=1&subtype=0
# Through an NVR, Hikvision channel 3 is  .../Streaming/Channels/301
Main Gate = 0
